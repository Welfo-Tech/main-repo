global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: welfo-api
    static_configs:
      - targets:
          - api:4000
    metrics_path: /metrics

  - job_name: welfo-services
    static_configs:
      - targets:
          - services:4001
    metrics_path: /metrics
